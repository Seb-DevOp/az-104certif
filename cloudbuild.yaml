# Optional Cloud Build pipeline: build, push, deploy.
#
# You do NOT need this file to deploy. The Cloud Run portal ("deploy from a repository")
# and `gcloud run deploy --source .` both build the Dockerfile directly and ignore it.
# It is here for the case where you prefer an explicit Cloud Build trigger, which gives you
# tagged images in Artifact Registry and a deploy step you control.
#
# To use it, set the trigger's configuration to "Cloud Build configuration file" with the
# path /cloudbuild.yaml.

substitutions:
  _REGION: europe-west1
  _SERVICE: az104-trainer
  _REPO: containers

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=4
